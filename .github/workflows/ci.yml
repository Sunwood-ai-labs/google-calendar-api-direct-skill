name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m py_compile scripts/gcal_api.py tests/test_gcal_api.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
